name: ci
on:
  push: { branches: [main] }
  pull_request:
permissions:
  contents: read
env:
  UV_PYTHON: "3.14"
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv python install 3.14
      - name: ruff (ruff.toml) on console, runtime-py, tests, scripts, deploy/local
        run: |
          for d in console runtime-py tests; do (cd "$d" && uv sync --all-extras && uv run ruff check . && uv run ruff format --check .); done
          (cd console && uv run ruff check ../scripts ../deploy/local && uv run ruff format --check ../scripts ../deploy/local)

  versions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/check_versions.py

  python:
    runs-on: ubuntu-latest
    strategy: { matrix: { dir: [console, runtime-py] } }
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv python install 3.14
      - working-directory: ${{ matrix.dir }}
        run: |
          if [ -f pyproject.toml ]; then uv sync --all-extras && uv run pytest --cov --cov-report=xml --cov-fail-under=90; else echo "no project yet"; fi
      - uses: actions/upload-artifact@v4
        if: hashFiles(format('{0}/coverage.xml', matrix.dir)) != ''
        with: { name: "coverage-${{ matrix.dir }}", path: "${{ matrix.dir }}/coverage.xml" }

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master 2026-09
        with: { toolchain: "1.98.1", components: "clippy,rustfmt,llvm-tools-preview" }
      - uses: taiki-e/install-action@cargo-llvm-cov
      - name: protoc (tonic-prost-build compiles proto/ramen/v1)
        run: sudo apt-get update -q && sudo apt-get install -y -q protobuf-compiler && protoc --version
      - working-directory: node-rs
        run: |
          if [ -f Cargo.toml ]; then
            cargo fmt --check && cargo clippy --all-targets -- -D warnings && cargo test && cargo build
            cargo llvm-cov --cobertura --output-path coverage.xml
          else echo "no crate yet"; fi
      - uses: actions/upload-artifact@v4
        with: { name: ramen-node, path: node-rs/target/debug/ramen-node, if-no-files-found: error }
      - uses: actions/upload-artifact@v4
        if: hashFiles('node-rs/coverage.xml') != ''
        with: { name: coverage-node-rs, path: node-rs/coverage.xml }

  tests:
    # conformance suites in "skip without env" mode: everything collects, fixture/schema tests run.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv python install 3.14
      - working-directory: tests
        run: uv sync && uv run pytest -q -rs
      - name: generated gRPC stubs match proto/ramen/v1 (tests/gen_proto.sh)
        working-directory: tests
        run: ./gen_proto.sh && git diff --exit-code -- src/ramen_proto

  node-conformance:
    # CONTRACTS §11 guards on real ramen-node processes (tests/conformance/test_mcp_node_local.py) + bridge via the mcp SDK.
    needs: [rust]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RAMEN_TEST_TLS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv python install 3.14
      - uses: actions/download-artifact@v4
        with: { name: ramen-node, path: bin }
      - run: chmod +x bin/ramen-node && echo "RAMEN_NODE_BIN=$PWD/bin/ramen-node" >> "$GITHUB_ENV"
      - name: runtime-py venv (sidecar + ramen-mcp-bridge)
        run: |
          (cd runtime-py && uv sync --all-extras && uv pip install pip)   # deps.py shells out to `python -m pip`; a uv-managed venv has no pip by default (I13)
          echo "RAMEN_RUNTIME_PYTHON=$PWD/runtime-py/.venv/bin/python" >> "$GITHUB_ENV"
          echo "RAMEN_BRIDGE_CMD=$PWD/runtime-py/.venv/bin/ramen-mcp-bridge" >> "$GITHUB_ENV"
      - name: both transports on real nodes (§16.5)
        working-directory: tests
        run: uv sync && uv run pytest -q -rs conformance/test_mcp_node_local.py conformance/test_transports_local.py conformance/test_sidecar_protocol.py conformance/test_numpy_deps.py

  client-windows:
    # §16.4 / X7: the client flow on the platform where fresh-machine setups break — the node built natively, the
    # runtime and bridge installed from a wheel, RAMEN_MCP_KEY from the environment, both transports, the SDK client.
    needs: [rust]
    runs-on: windows-latest
    timeout-minutes: 30
    defaults: { run: { shell: bash } }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master 2026-09
        with: { toolchain: "1.98.1" }
      - uses: arduino/setup-protoc@v3
        with: { version: "28.x", repo-token: "${{ secrets.GITHUB_TOKEN }}" }
      - uses: astral-sh/setup-uv@v5
      - run: uv python install 3.14
      - name: build the node on Windows
        working-directory: node-rs
        run: cargo build --release
      - name: runtime-py venv (sidecar + ramen-mcp-bridge) and its own tests, bridge env var included
        working-directory: runtime-py
        run: |
          uv sync --all-extras
          uv pip install pip   # deps.py shells out to `python -m pip`; a uv-managed venv has no pip by default (I13)
          uv run pytest -q tests/test_bridge.py
      - name: conformance on both transports, key from RAMEN_MCP_KEY
        working-directory: tests
        env:
          RAMEN_NODE_BIN: ${{ github.workspace }}\node-rs\target\release\ramen-node.exe
          RAMEN_MCP_KEY: test-key
        run: uv sync && uv run pytest -q -rs conformance/test_transports_local.py conformance/test_mcp_node_local.py conformance/test_numpy_deps.py

  compose-check:
    # hashFiles() is empty at job level (no checkout yet), so the e2e guard is computed here.
    runs-on: ubuntu-latest
    outputs: { present: "${{ steps.c.outputs.present }}" }
    steps:
      - uses: actions/checkout@v4
      - id: c
        run: |
          if [ "${{ hashFiles('deploy/local/docker-compose.yml') }}" != "" ]; then echo present=true >> "$GITHUB_OUTPUT"; else echo present=false >> "$GITHUB_OUTPUT"; fi

  e2e:
    needs: [lint, versions, python, rust, tests, compose-check]
    if: needs.compose-check.outputs.present == 'true'
    continue-on-error: false
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      RAMEN_CONSOLE_URL: https://localhost:8443
      RAMEN_NODE_URL: localhost:8080   # gRPC h2c target (CONTRACTS §11)
      RAMEN_E2E_GROUP: demo
      RAMEN_E2E_ZONE: local
      RAMEN_MCP_KEY: ci-mcp-key
      RAMEN_MCP_KEYS: ci-mcp-key
      RAMEN_ADMIN_KEY: ci-admin-key
      RAMEN_ADMIN_EMAIL: admin@ramen.local
      RAMEN_ADMIN_PASSWORD: ramen-admin
      RAMEN_TLS_INSECURE: "1"
      RAMEN_DEMO_REPO: https://github.com/bkraad47/ramen-demo-mcp-group
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv python install 3.14
      - uses: actions/download-artifact@v4
        with: { path: artifacts, pattern: "coverage-*" }
      - name: Runtime venv for sidecar conformance + ramen-mcp-bridge
        run: |
          if [ -f runtime-py/pyproject.toml ]; then
            (cd runtime-py && uv sync --all-extras && uv pip install pip)   # deps.py shells out to `python -m pip`; a uv-managed venv has no pip by default (I13)
            echo "RAMEN_RUNTIME_PYTHON=$PWD/runtime-py/.venv/bin/python" >> "$GITHUB_ENV"
            echo "RAMEN_BRIDGE_CMD=$PWD/runtime-py/.venv/bin/ramen-mcp-bridge" >> "$GITHUB_ENV"
          fi
      - name: grpcurl (wait_ready gRPC health mode)
        run: |
          curl -sSL https://github.com/fullstorydev/grpcurl/releases/download/v1.9.3/grpcurl_1.9.3_linux_x86_64.tar.gz | sudo tar -xz -C /usr/local/bin grpcurl
          grpcurl -version
      - name: Compose up
        run: docker compose -f deploy/local/docker-compose.yml up -d --build
      - name: Wait ready
        run: |
          scripts/wait_ready.sh "$RAMEN_CONSOLE_URL/login" 180
          scripts/wait_ready.sh "$RAMEN_NODE_URL" 180 2 --any   # gRPC health answers (NOT_SERVING before the first deploy)
      - name: e2e (deploys demo, mints MCP key) then conformance (gRPC + bridge)
        working-directory: tests
        run: uv sync && uv run pytest -q -rs e2e conformance --cov --cov-report=xml --cov-report=term
      - name: Smoke script (grpcurl path)
        run: scripts/cloud_smoke.sh "$RAMEN_CONSOLE_URL" "$RAMEN_ADMIN_EMAIL" "$RAMEN_ADMIN_PASSWORD" "$RAMEN_ADMIN_KEY" "$RAMEN_NODE_URL"
        # the compose console's certificate is self-signed inside the container (no CA file to hand curl), so this is
        # the one place RAMEN_SMOKE_INSECURE is set; a cloud run passes RAMEN_SMOKE_CA instead (review 0.5.0 M6)
        env: { RAMEN_SMOKE_ZONE: local, RAMEN_ZONE_PROVIDER: local, RAMEN_ZONE_REGION: local, RAMEN_SMOKE_ADMIN: "1", RAMEN_SMOKE_INSECURE: "1" }
      - name: Compose logs
        if: failure()
        run: docker compose -f deploy/local/docker-compose.yml logs --no-color --tail=300
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: coverage-tests, path: tests/coverage.xml, if-no-files-found: ignore }
      - name: Coverage report
        if: always()
        run: python3 scripts/coverage_report.py --artifacts artifacts --out coverage-report.md
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: coverage-report, path: coverage-report.md, if-no-files-found: ignore }
      - name: Compose down
        if: always()
        run: docker compose -f deploy/local/docker-compose.yml down -v

  kind:
    # CONTRACTS §12.3: the multi-zone proofs on a real Kubernetes cluster — two zones serving independently, an HPA
    # scaling a zone under generated gRPC load and back, rebalance changing the split, per-zone package lists.
    # Slow (cluster + two image builds + several deploys), so it is kept off the pull-request path and out of the
    # release pipeline; `main` and manual runs only. Everything it needs lives in deploy/kind.
    needs: [lint, versions, python, rust, tests]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      KIND_VERSION: v0.33.0
      HELM_VERSION: v3.16.4
      RAMEN_KIND_SUITES: kind          # e2e + conformance run against compose in the `e2e` job
      RAMEN_KIND_LOAD_THREADS: "8"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv python install 3.14
      - name: kind + helm
        run: |
          curl -sSLo /tmp/kind "https://kind.sigs.k8s.io/dl/${KIND_VERSION}/kind-linux-amd64"
          sudo install -m 0755 /tmp/kind /usr/local/bin/kind && kind version
          curl -sSL "https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz" | tar -xz -C /tmp
          sudo install -m 0755 /tmp/linux-amd64/helm /usr/local/bin/helm && helm version --short
      - name: Build the console and worker images
        run: make build
      - name: Bring the cluster up
        run: deploy/kind/up.sh
      - name: Run the proofs
        run: deploy/kind/test.sh
      - name: Cluster state on failure
        if: failure()
        run: |
          kubectl --context kind-ramen get pods,deploy,hpa -A || true
          kubectl --context kind-ramen -n ramen-system logs deploy/console --tail=200 || true
          for ns in ramen-demo-a ramen-demo-b; do
            kubectl --context kind-ramen -n "$ns" logs -l app=worker --tail=100 --max-log-requests=6 || true
          done
      - name: Tear the cluster down
        if: always()
        run: deploy/kind/down.sh
