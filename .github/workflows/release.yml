name: release
on:
  push:
    tags: ["v*"]
permissions: { contents: write }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { submodules: false }
      - name: Version
        run: |
          TAG=${GITHUB_REF_NAME#v}; FILE=$(cat VERSION)
          [ "$TAG" = "$FILE" ] || { echo "tag $TAG != VERSION $FILE"; exit 1; }
          echo "VER=$TAG" >> "$GITHUB_ENV"
      - name: Versions
        run: python3 scripts/check_versions.py --tag "$GITHUB_REF_NAME"
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master 2026-09
        with: { toolchain: "1.98.1" }
      - name: Build node
        working-directory: node-rs
        run: |
          if [ -f Cargo.toml ]; then cargo build --release; fi
      - name: Package
        run: |
          mkdir -p dist
          git archive --format=zip -o "dist/ramen-$VER-source.zip" HEAD
          [ -f node-rs/target/release/ramen-node ] && zip -j "dist/ramen-$VER-node-linux-amd64.zip" node-rs/target/release/ramen-node || true
          # version-less copy: Glama's build downloads releases/latest/download/ramen-node-linux-amd64.zip
          cp "dist/ramen-$VER-node-linux-amd64.zip" dist/ramen-node-linux-amd64.zip
          zip -r "dist/ramen-$VER-console.zip" console runtime-py deploy skills -x '*/.venv/*' '*/__pycache__/*' '*/target/*'
          ls -la dist
      - uses: actions/setup-node@v4
        with: { node-version: "24" }
      - name: MCPB bundle (Smithery, Claude Desktop)
        run: npx -y @anthropic-ai/mcpb@2.1.2 pack mcpb "dist/ramen-$VER.mcpb"
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          name: Ramen v${{ env.VER }}
          generate_release_notes: true
          files: dist/*

  # Official MCP registry (io.github.bkraad47/ramen) from server.json; GitHub OIDC, no secret.
  registry:
    needs: build
    # only bkraad47's own releases publish to the registries (not forks, not other pushers)
    if: github.repository == 'bkraad47/ramen' && github.actor == 'bkraad47'
    runs-on: ubuntu-latest
    permissions: { contents: read, id-token: write }
    steps:
      - uses: actions/checkout@v4
      - name: Publish
        run: |
          curl -fsSL https://github.com/modelcontextprotocol/registry/releases/download/v1.8.1/mcp-publisher_linux_amd64.tar.gz | tar xz mcp-publisher
          ./mcp-publisher login github-oidc
          # a published version is immutable: re-running a release must not fail on it
          if ! out=$(./mcp-publisher publish 2>&1); then echo "$out"; grep -q "duplicate version" <<<"$out" || exit 1; fi
          echo "$out"

  # Smithery (bkraad47/ramen) from the MCPB bundle; needs the SMITHERY_API_KEY repo secret.
  smithery:
    needs: build
    # only bkraad47's own releases publish to the registries (not forks, not other pushers)
    if: github.repository == 'bkraad47/ramen' && github.actor == 'bkraad47'
    runs-on: ubuntu-latest
    permissions: { contents: read }
    env:
      SMITHERY_API_KEY: ${{ secrets.SMITHERY_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "24" }
      - name: Publish
        run: |
          if [ -z "$SMITHERY_API_KEY" ]; then echo "::warning::SMITHERY_API_KEY not set; Smithery not published"; exit 0; fi
          VER=$(cat VERSION)
          npx -y @anthropic-ai/mcpb@2.1.2 pack mcpb "ramen-$VER.mcpb"
          npx -y @smithery/cli@4.11.1 mcp publish "./ramen-$VER.mcpb" -n bkraad47/ramen

  # Public images (R6, 0.7.0): docker.io/bkraad47/{ramen-worker,ramen-console} and ghcr.io/bkraad47/{...}, linux/amd64 +
  # linux/arm64, tags <version> and latest. Either cloud can pull them straight from the charts (deploy/README.md
  # "Public images"), so a `make push` to a per-project registry is optional. GHCR uses GITHUB_TOKEN; Docker Hub needs
  # the DOCKERHUB_USERNAME / DOCKERHUB_TOKEN repo secrets and is skipped with a warning when they are unset.
  images:
    needs: build
    # only bkraad47's own releases publish images (not forks, not other pushers)
    if: github.repository == 'bkraad47/ramen' && github.actor == 'bkraad47'
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write }
    steps:
      - uses: actions/checkout@v4
      - name: Version
        run: echo "VER=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Docker Hub credentials
        id: hub
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -z "$DOCKERHUB_USERNAME" ] || [ -z "$DOCKERHUB_TOKEN" ]; then
            echo "::warning::DOCKERHUB_USERNAME/DOCKERHUB_TOKEN not set; Docker Hub images not pushed (GHCR only)"
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/login-action@v3
        if: steps.hub.outputs.enabled == 'true'
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tags
        env:
          HUB: ${{ steps.hub.outputs.enabled }}
        run: |
          tags() { # <image>: ghcr always, docker.io when Docker Hub is configured
            t="ghcr.io/bkraad47/$1:$VER,ghcr.io/bkraad47/$1:latest"
            [ "$HUB" = "true" ] && t="$t,docker.io/bkraad47/$1:$VER,docker.io/bkraad47/$1:latest"
            echo "$t"
          }
          echo "WORKER_TAGS=$(tags ramen-worker)" >> "$GITHUB_ENV"
          echo "CONSOLE_TAGS=$(tags ramen-console)" >> "$GITHUB_ENV"
      - name: Worker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: node-rs/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ env.VER }}
          tags: ${{ env.WORKER_TAGS }}
      - name: Console image
        uses: docker/build-push-action@v6
        with:
          context: console
          file: console/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: RAMEN_VERSION=${{ env.VER }}
          tags: ${{ env.CONSOLE_TAGS }}
