[project]
name = "ramen-console"
version = "0.5.7"
description = "Ramen console: FastAPI + Jinja2 + HTMX manager UI and /api/v1 for groups, environments, zones, secrets and deploys"
license = "BSD-3-Clause"
requires-python = ">=3.14"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "jinja2>=3.1",
  "python-multipart>=0.0.9",
  "itsdangerous>=2.2",
  "argon2-cffi>=23",
  "cryptography>=43",
  "pyyaml>=6",
  "httpx>=0.27",
  "authlib>=1.3",
  "google-cloud-firestore>=2.19",
  "boto3>=1.35",
  "asyncpg>=0.29",
  "grpcio>=1.66",
  "grpcio-health-checking>=1.66",
  "protobuf>=5.28",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "pytest-asyncio>=0.24", "moto[dynamodb]>=5", "ruff>=0.16", "grpcio-tools>=1.66"]
gcp = ["google-cloud-storage>=2.18", "google-cloud-secret-manager>=2.20", "google-cloud-logging>=3.11",
       "google-api-python-client>=2.140", "google-auth-httplib2>=0.2", "kubernetes>=30"]
aws = ["kubernetes>=30"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ramen_console"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
markers = ["integration: needs external services"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["src"]
omit = ["src/ramen_console/proto/*"]

[tool.ruff]
extend = "../ruff.toml"
extend-exclude = ["src/ramen_console/proto"]  # generated by grpcio-tools (make proto)
