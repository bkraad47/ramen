# Envoy Gateway (AKS): at most 10 `tools/call slow_report` requests a minute for group demo, zone a.
# A second HTTPRoute matches Mcp-Method and Mcp-Name (more specific, so it wins) and carries a local rate limit.
# EXAMPLE, not applied to a live cluster. A local limit counts per Envoy replica, not across them.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: worker-slow-report
  namespace: ramen-demo-a
spec:
  parentRefs: [{ name: ramen, namespace: ramen-system, sectionName: https }]
  rules:
    - matches:
        - path: { type: PathPrefix, value: /mcp }
          headers:
            - { name: ramen-group, value: demo }
            - { name: ramen-zone, value: a }
            - { name: Mcp-Method, value: tools/call }
            - { name: Mcp-Name, value: slow_report }
      backendRefs: [{ name: worker, port: 8080 }]
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: slow-report-rate
  namespace: ramen-demo-a
spec:
  targetRefs:
    - { group: gateway.networking.k8s.io, kind: HTTPRoute, name: worker-slow-report }
  rateLimit:
    type: Local
    local:
      rules:
        - limit: { requests: 10, unit: Minute }
