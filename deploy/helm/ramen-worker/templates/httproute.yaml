{{- if and .Values.route.enabled (ne .Values.provider "aws") }}
# CONTRACTS §11: the Gateway routes gRPC calls by metadata ramen-group / ramen-zone (no path rewrite). Mcp, Health and
# reflection (route.paths) are reachable through the LB; Admin stays cluster-internal.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: worker
  namespace: {{ include "rw.ns" . }}
  labels: {{- include "rw.labels" . | nindent 4 }}
spec:
  parentRefs: [{ name: {{ .Values.route.gateway }}, namespace: {{ .Values.route.gatewayNamespace }} }]
  rules:
    - matches:
        {{- range .Values.route.paths }}
        - path: { type: PathPrefix, value: {{ . | quote }} }
          headers:
            - { name: ramen-group, value: {{ $.Values.group | quote }} }
            - { name: ramen-zone, value: {{ $.Values.zone | quote }} }
        {{- end }}
      backendRefs: [{ name: worker, port: {{ .Values.port }} }]
---
apiVersion: networking.gke.io/v1
kind: HealthCheckPolicy
metadata:
  name: worker
  namespace: {{ include "rw.ns" . }}
  labels: {{- include "rw.labels" . | nindent 4 }}
spec:
  default:
    checkIntervalSec: 15
    config:
      type: GRPC
      grpcHealthCheck: { port: {{ .Values.port }} }
  targetRef: { group: "", kind: Service, name: worker }
{{- end }}
