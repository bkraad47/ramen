{{- if .Values.route.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: worker
  namespace: {{ include "rw.ns" . }}
  labels: {{- include "rw.labels" . | nindent 4 }}
spec:
  parentRefs: [{ name: {{ .Values.route.gateway }}, namespace: {{ .Values.route.gatewayNamespace }} }]
  rules:
    - matches: [{ path: { type: PathPrefix, value: {{ printf "/mcp/%s/%s" .Values.group .Values.zone | quote }} } }]
      filters:
        - type: URLRewrite
          urlRewrite: { path: { type: ReplacePrefixMatch, replacePrefixMatch: /mcp } }
      backendRefs: [{ name: worker, port: {{ .Values.port }} }]
---
apiVersion: networking.gke.io/v1
kind: HealthCheckPolicy
metadata:
  name: worker
  namespace: {{ include "rw.ns" . }}
  labels: {{- include "rw.labels" . | nindent 4 }}
spec:
  default:
    checkIntervalSec: 15
    config:
      type: HTTP
      httpHealthCheck: { requestPath: /healthz, port: {{ .Values.port }} }
  targetRef: { group: "", kind: Service, name: worker }
{{- end }}
