{{- if eq .Values.provider "aws" }}
{{- $canary := int .Values.aws.canaryWeight }}
# CONTRACTS §8 + §11 (UNTESTED on a real account): gRPC on the shared ALB. Listener rule = the two routing headers
# (ramen-group / ramen-zone) + path /ramen.v1.Mcp/*; target groups speak gRPC (backend-protocol-version GRPC) and are
# health-checked with grpc.health.v1 code 0. One weighted forward action → stable/canary target groups.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: worker
  namespace: {{ include "rw.ns" . }}
  labels: {{- include "rw.labels" . | nindent 4 }}
  annotations:
    alb.ingress.kubernetes.io/group.name: {{ .Values.aws.albGroup }}
    alb.ingress.kubernetes.io/group.order: "10"
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS":443}]'
    alb.ingress.kubernetes.io/backend-protocol: HTTP
    alb.ingress.kubernetes.io/backend-protocol-version: GRPC
    alb.ingress.kubernetes.io/healthcheck-protocol: HTTP
    alb.ingress.kubernetes.io/healthcheck-path: /grpc.health.v1.Health/Check
    alb.ingress.kubernetes.io/success-codes: "0"
    alb.ingress.kubernetes.io/conditions.worker: >-
      [{"field":"http-header","httpHeaderConfig":{"httpHeaderName":"ramen-group","values":[{{ .Values.group | quote }}]}},{"field":"http-header","httpHeaderConfig":{"httpHeaderName":"ramen-zone","values":[{{ .Values.zone | quote }}]}}]
    alb.ingress.kubernetes.io/actions.worker: >-
      {"type":"forward","forwardConfig":{"targetGroups":[{"serviceName":"worker","servicePort":"{{ .Values.port }}","weight":{{ sub 100 $canary }}},{"serviceName":"worker-canary","servicePort":"{{ .Values.port }}","weight":{{ $canary }}}]}}
spec:
  ingressClassName: alb
  rules:
    - http:
        paths:
          - path: {{ .Values.route.mcpPath | quote }}
            pathType: Prefix
            backend: { service: { name: worker, port: { name: use-annotation } } }
{{- end }}
