{{- if .Values.secret.create }}
apiVersion: v1
kind: Secret
metadata:
  name: ramen-deploy
  namespace: {{ include "rw.ns" . }}
  labels: {{- include "rw.labels" . | nindent 4 }}
type: Opaque
stringData:
  RAMEN_ENV: {{ .Values.environment | quote }}
  {{- range $k, $v := .Values.secret.data }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
{{- end }}
