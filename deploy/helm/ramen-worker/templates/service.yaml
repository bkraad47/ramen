apiVersion: v1
kind: Service
metadata:
  name: worker
  namespace: {{ include "rw.ns" . }}
  labels: {{- include "rw.labels" . | nindent 4 }}
  {{- if eq .Values.provider "gcp" }}
  annotations:
    cloud.google.com/neg: '{"exposed_ports": {"{{ .Values.port }}": {"name": "ramen-{{ .Values.group }}-{{ .Values.zone }}"}}}'
  {{- end }}
spec:
  type: ClusterIP
  {{- if eq .Values.provider "aws" }}
  selector: { app: worker, ramen.io/track: stable }
  {{- else }}
  selector: { app: worker }
  {{- end }}
  ports: [{ name: grpc, port: {{ .Values.port }}, targetPort: grpc, appProtocol: kubernetes.io/h2c }]   # CONTRACTS §11: gRPC h2c
{{- if eq .Values.provider "aws" }}
---
# aws: separate canary Service so the ALB Ingress can weight stable/canary target groups (CONTRACTS §8)
apiVersion: v1
kind: Service
metadata:
  name: worker-canary
  namespace: {{ include "rw.ns" . }}
  labels: {{- include "rw.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector: { app: worker, ramen.io/track: canary }
  ports: [{ name: grpc, port: {{ .Values.port }}, targetPort: grpc, appProtocol: kubernetes.io/h2c }]
{{- end }}
---
# §24.1: real worker pods only (both tracks). A sleeping zone's activator (Deployment/worker-activator, applied by the
# console; labels app=worker + ramen.io/role=activator, so Service/worker above keeps selecting it for every edge)
# forwards to this Service once the zone is awake. No edge object points here.
apiVersion: v1
kind: Service
metadata:
  name: worker-direct
  namespace: {{ include "rw.ns" . }}
  labels: {{- include "rw.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector: { app: worker, ramen.io/role: worker }
  ports: [{ name: grpc, port: {{ .Values.port }}, targetPort: grpc, appProtocol: kubernetes.io/h2c }]
