apiVersion: v1
kind: Service
metadata:
  name: worker
  namespace: {{ include "rw.ns" . }}
  labels: {{- include "rw.labels" . | nindent 4 }}
  annotations:
    cloud.google.com/neg: '{"exposed_ports": {"{{ .Values.port }}": {"name": "ramen-{{ .Values.group }}-{{ .Values.zone }}"}}}'
spec:
  type: ClusterIP
  selector: { app: worker }
  ports: [{ name: http, port: {{ .Values.port }}, targetPort: http }]
