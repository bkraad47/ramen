apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.serviceAccount.name }}
  namespace: {{ include "rw.ns" . }}
  labels: {{- include "rw.labels" . | nindent 4 }}
  {{- if eq .Values.provider "aws" }}
  {{- if .Values.aws.roleArn }}
  annotations:
    eks.amazonaws.com/role-arn: {{ .Values.aws.roleArn }}
  {{- end }}
  {{- else if ne .Values.serviceAccount.gsa "-" }}
  annotations:
    iam.gke.io/gcp-service-account: {{ include "rw.gsa" . }}
  {{- end }}
