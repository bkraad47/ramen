# helm template ramen-worker deploy/helm/ramen-worker --set project=<p>,group=demo,zone=a,gcpZone=us-central1-a | kubectl apply -f -
provider: gcp               # gcp | aws (CONTRACTS §7 / §8). provider=aws is UNTESTED on a real account.
project: ""                 # GCP project id (required on gcp)
aws:                        # provider=aws only
  account: ""               # AWS account id: ECR image + groups bucket defaults
  region: us-east-1
  zone: us-east-1a          # nodeSelector topology.kubernetes.io/zone (zone record `region` field)
  roleArn: ""               # IAM role for KSA worker (IRSA); empty = no annotation (console sets it via create_service_account)
  albGroup: ramen           # ALB IngressGroup shared with the console Ingress
  canaryWeight: 0           # 0-50, traffic share of worker-canary; the console rewrites it on deploy/rebalance
region: us-central1
group: demo
environment: default        # → RAMEN_ENV in Secret ramen-deploy
zone: a                     # zone record name → namespace ramen-<group>-<zone>
gcpZone: us-central1-a      # nodeSelector topology.kubernetes.io/zone (zone record `region` field)
image: ""                   # default: <region>-docker.pkg.dev/<project>/ramen/worker:<tag>
tag: 0.3.1
pullPolicy: Always
createNamespace: true
serviceAccount:
  name: worker
  gsa: ""                   # default: ramen-<group>-<zone>@<project>.iam.gserviceaccount.com; "-" = no WI annotation
bucketUri: ""               # default: gs://ramen-<project>-groups/<group>
bucketPath: /data/bucket
port: 8080
replicas: 1                 # stable `worker`
canaryReplicas: 1           # `worker-canary` (console scales to 0 on failed canary)
size: s                     # key into sizes (super admin allowlist per group+zone)
sizes:
  s: { cpu: 250m, memory: 512Mi }
  m: { cpu: 500m, memory: 1Gi }
  l: { cpu: "1", memory: 2Gi }
hpa: { enabled: false, minReplicas: 1, maxReplicas: 4, cpuPercent: 70 }
env:                        # extra NON-deploy vars only (container env beats the Secret); deploy-scoped keys go in secret.data
  RAMEN_TRUST_PROXY: "1"
secret:
  create: true              # placeholder `ramen-deploy`; the console rewrites it on every deploy
  data:                     # RAMEN_ENV, RAMEN_MCP_KEYS, RAMEN_ADMIN_KEY, RAMEN_ALLOWED_CIDRS, RAMEN_SIDECAR_IDLE_SECS, RAMEN_SECRET_<GROUP>__<VAR>...
    RAMEN_MCP_KEYS: ""
    RAMEN_ADMIN_KEY: ""
route:                      # HTTPRoute on the console Gateway (gcp only; aws renders an ALB Ingress instead): https://<console_ip>/mcp/<group>/<zone> → worker:8080/mcp
  enabled: true
  gateway: ramen
  gatewayNamespace: ramen-system
  label: ramen.io/routes    # namespace label the Gateway's allowedRoutes selector requires

consoleNamespace: ramen-system
networkPolicy:
  enabled: true
  gcpCidrs: ["35.191.0.0/16", "130.211.0.0/22"]   # Google front ends / health checkers
  awsCidrs: ["10.0.0.0/16"]                        # the VPC CIDR from deploy/terraform/aws (ALB targets)
