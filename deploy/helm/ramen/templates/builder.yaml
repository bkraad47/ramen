{{- if or (include "ramen.builder.enabled" .) .Values.evals.image (eq (.Values.skillspector.engine | default "none") "skillspector") }}
{{- /* §38.2 (D85): no shared builder ServiceAccount. The console creates `ramen-build-<group>` here on a group's first
build (annotated with that group's cloud identity, which may push only to the group's repository); the evals and
scan Jobs run as `ramen-evals` (evals-serviceaccount.yaml). */ -}}
{{- if .Values.rbac.create }}
# What the console needs to run a build or an evals Job and nothing more: the context ConfigMap, the Job, the Job
# pod's log, (§29.2) the Secret that carries an evals run's MCP key and provider keys — created and deleted, never
# read — and (§38.2) the per-group build ServiceAccounts `ramen-build-<group>`.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ramen-console-build
  labels: {{- include "ramen.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [configmaps]
    verbs: [get, create, patch, delete]
  - apiGroups: [""]
    resources: [secrets]
    verbs: [create, delete]
  - apiGroups: [batch]
    resources: [jobs]
    verbs: [get, list, create, delete]
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list]
  - apiGroups: [""]
    resources: [pods/log]
    verbs: [get]
  {{- if include "ramen.builder.enabled" . }}
  - apiGroups: [""]
    resources: [serviceaccounts]
    verbs: [create, patch, delete]
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ramen-console-build
  labels: {{- include "ramen.labels" . | nindent 4 }}
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: ramen-console-build }
subjects: [{ kind: ServiceAccount, name: {{ .Values.serviceAccount.name }}, namespace: {{ .Release.Namespace }} }]
{{- end }}
{{- end }}
