{{- if .Values.console.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ramen.fullname" . }}-console
  labels: {{- include "ramen.labels" . | nindent 4 }}
    ramen.io/role: console
spec:
  replicas: {{ .Values.console.replicas }}
  selector:
    matchLabels: { app.kubernetes.io/instance: {{ .Release.Name }}, ramen.io/role: console }
  template:
    metadata:
      labels: {{- include "ramen.labels" . | nindent 8 }}
        ramen.io/role: console
    spec:
      serviceAccountName: {{ include "ramen.fullname" . }}
      securityContext: { runAsNonRoot: true }
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: { app.kubernetes.io/instance: {{ .Release.Name }}, ramen.io/role: console }
      containers:
        - name: console
          image: "{{ .Values.image.console }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports: [{ name: http, containerPort: {{ .Values.console.port }} }]
          env:
            - { name: RAMEN_CONSOLE_PORT, value: {{ .Values.console.port | quote }} }
          envFrom:
            - configMapRef: { name: {{ include "ramen.fullname" . }}-env }
            - secretRef: { name: {{ include "ramen.fullname" . }}-secrets }
          resources: {{- toYaml .Values.console.resources | nindent 12 }}
          livenessProbe: { httpGet: { path: /healthz, port: http }, periodSeconds: 10 }
          readinessProbe: { httpGet: { path: /healthz, port: http }, periodSeconds: 5 }
{{- end }}
