{{- if and (include "ramen.engines.enabled" .) (not .Values.engines.existingSecret) }}
{{- /* D92 (CONTRACTS §39.7): the optional engines' credentials, random at install and kept across upgrades (`lookup`
finds the Secret already written; empty under `helm template`). Never printed: a super admin with cluster access reads
them with `kubectl -n <ns> get secret ramen-engines -o jsonpath='{.data.password}' | base64 -d`.
  username / password               the operator: promptfoo's and Jaeger's TLS front (Basic, or Bearer <password>),
                                    Phoenix's UI as admin@localhost
  upload-username / upload-password the evals Jobs: one promptfoo share upload per connection, nothing else
  phoenix-secret                    PHOENIX_SECRET (JWT signing); phoenix-admin-secret = PHOENIX_ADMIN_SECRET, the
                                    bearer the collector sidecar posts spans to Phoenix with (also Phoenix's REST API) */ -}}
{{- $name := include "ramen.engines.secretName" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $old := (and $existing $existing.data) | default dict }}
{{- $vals := dict }}
{{- /* Phoenix: ≥ 32 characters with a digit and a lowercase letter; the two secrets must differ */ -}}
{{- range $k := list "password" "upload-password" "phoenix-secret" "phoenix-admin-secret" }}
{{- $v := printf "%s7k" (randAlphaNum 38 | lower) }}{{/* ggignore: generated at install time, not a secret in the source */}}
{{- if hasKey $old $k }}{{- $v = index $old $k | b64dec }}{{- end }}
{{- $_ := set $vals $k $v }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels: {{- include "ramen.labels" . | nindent 4 }}
type: Opaque
stringData:
  username: admin
  upload-username: evals
  {{- range $k, $v := $vals }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
{{- end }}
