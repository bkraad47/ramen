{{- if or .Values.evals.image (eq (.Values.skillspector.engine | default "none") "skillspector") }}
# §33.4a: the identity the evals and scan Jobs run as — a group repo's promptfoo config runs here. Bound to no Role,
# no API-server token mounted; its cloud identity (Terraform `evals_gsa` / `evals_role_arn` / `evals_client_id`:
# logging only) holds no registry, bucket or Secret Manager right. Image builds run as `ramen-build-<group>` (§38.2).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.evals.serviceAccount }}
  labels: {{- include "ramen.labels" . | nindent 4 }}
  {{- if include "ramen.evals.identity" . }}
  annotations:
    {{- if eq .Values.provider "azure" }}
    azure.workload.identity/client-id: {{ .Values.evals.clientId | quote }}
    {{- with .Values.azure.tenantId }}
    azure.workload.identity/tenant-id: {{ . | quote }}
    {{- end }}
    {{- else if eq .Values.provider "aws" }}
    eks.amazonaws.com/role-arn: {{ .Values.evals.roleArn }}
    {{- else }}
    iam.gke.io/gcp-service-account: {{ .Values.evals.gsa }}
    {{- end }}
  {{- end }}
automountServiceAccountToken: false
{{- end }}
