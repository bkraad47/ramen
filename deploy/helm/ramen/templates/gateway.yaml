{{- if .Values.gateway.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ .Values.gateway.name }}
  labels: {{- include "ramen.labels" . | nindent 4 }}
spec:
  gatewayClassName: {{ .Values.gateway.className }}
  addresses:
    - type: NamedAddress
      value: {{ .Values.gateway.staticIpName }}
  listeners:
    - name: https
      protocol: HTTPS
      port: 443
      tls:
        mode: Terminate
        certificateRefs: [{ kind: Secret, name: {{ .Values.gateway.tlsSecret }} }]
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels: { {{ .Values.gateway.routesLabel }}: "true" }
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: console
  labels: {{- include "ramen.labels" . | nindent 4 }}
spec:
  parentRefs: [{ name: {{ .Values.gateway.name }}, namespace: {{ .Release.Namespace }} }]
  rules:
    - matches: [{ path: { type: PathPrefix, value: / } }]
      backendRefs: [{ name: console, port: 80 }]
---
apiVersion: networking.gke.io/v1
kind: HealthCheckPolicy
metadata:
  name: console
  labels: {{- include "ramen.labels" . | nindent 4 }}
spec:
  default:
    checkIntervalSec: 15
    config:
      type: HTTP
      httpHealthCheck: { requestPath: /healthz, port: {{ .Values.console.port }} }
  targetRef: { group: "", kind: Service, name: console }
---
# Console API calls that drive GCP operations (rebalance, ip-rules, service accounts) can exceed the LB's 30s default.
apiVersion: networking.gke.io/v1
kind: GCPBackendPolicy
metadata:
  name: console
  labels: {{- include "ramen.labels" . | nindent 4 }}
spec:
  default:
    timeoutSec: {{ .Values.console.backendTimeoutSec | default 300 }}
  targetRef: { group: "", kind: Service, name: console }
{{- end }}
