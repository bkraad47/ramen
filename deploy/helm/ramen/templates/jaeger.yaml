{{- if eq (.Values.otel.collector | default "none") "jaeger" }}
# §24.3: Jaeger all-in-one for trying telemetry out and for the test runs — in-memory storage. Jaeger has no auth of
# its own (D92 §39.7): its query UI/API listens on 127.0.0.1 only, behind the TLS front (`ramen_console.tlsproxy`, the
# console image) on 16686, which wants the operator's credential from Secret ramen-engines; OTLP stays open on 4318 for
# the exporters the NetworkPolicy admits. Not for production: point Config → Telemetry at your own OTLP collector
# there. Deliberately no Ingress/HTTPRoute.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jaeger
  labels: { app.kubernetes.io/name: jaeger, app.kubernetes.io/instance: {{ .Release.Name }} }
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: jaeger, app.kubernetes.io/instance: {{ .Release.Name }} }
  template:
    metadata:
      labels: { app.kubernetes.io/name: jaeger, app.kubernetes.io/instance: {{ .Release.Name }} }
    spec:
      securityContext: { runAsNonRoot: true, runAsUser: 10001 }
      containers:
        - name: jaeger
          image: {{ .Values.otel.jaeger.image | quote }}
          # D86 §39.3: OTLP in, the query UI and the admin port over TLS with the console-issued leaf
          args:
            - --memory.max-traces=20000
            - --query.http-server.host-port=127.0.0.1:16687   # D92: only the TLS front beside it reaches the query API
            - --query.grpc-server.host-port=127.0.0.1:16685
            {{- range (list "collector.otlp.http.tls" "collector.otlp.grpc.tls" "admin.http.tls") }}
            - --{{ . }}.enabled=true
            - --{{ . }}.cert=/tls/tls.crt
            - --{{ . }}.key=/tls/tls.key
            {{- end }}
          env:
            - { name: COLLECTOR_OTLP_ENABLED, value: "true" }
          securityContext: { allowPrivilegeEscalation: false, capabilities: { drop: [ALL] }, seccompProfile: { type: RuntimeDefault } }
          ports:
            - { name: otlp-http, containerPort: 4318 }
            - { name: admin, containerPort: 14269 }
          readinessProbe: { httpGet: { path: /, port: admin, scheme: HTTPS }, periodSeconds: 5 }
          resources: {{- toYaml .Values.otel.jaeger.resources | nindent 12 }}
          volumeMounts: [{ name: tls, mountPath: /tls, readOnly: true }]
        - name: tls   # D92: the query UI/API's TLS front, credential required (Basic admin:<password> or Bearer <password>)
          image: {{ include "ramen.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: [python, -m, ramen_console.tlsproxy, --listen, "0.0.0.0:16686", --upstream, "127.0.0.1:16687",
                    --cert, /tls/tls.crt, --key, /tls/tls.key, --require-auth]
          env:
            - { name: RAMEN_PROXY_USER, valueFrom: { secretKeyRef: { name: {{ include "ramen.engines.secretName" . }}, key: username } } }
            - { name: RAMEN_PROXY_PASSWORD, valueFrom: { secretKeyRef: { name: {{ include "ramen.engines.secretName" . }}, key: password } } }
          securityContext: { runAsUser: 10001, allowPrivilegeEscalation: false, capabilities: { drop: [ALL] }, seccompProfile: { type: RuntimeDefault } }
          ports:
            - { name: query, containerPort: 16686 }
          readinessProbe: { tcpSocket: { port: query }, periodSeconds: 5 }   # every HTTP path wants the credential
          resources: { requests: { cpu: 10m, memory: 32Mi }, limits: { memory: 128Mi } }
          volumeMounts: [{ name: tls, mountPath: /tls, readOnly: true }]
      volumes:
        - { name: tls, secret: { secretName: ramen-tls-jaeger } }   # written by the console (D86 §39.2)
---
apiVersion: v1
kind: Service
metadata:
  name: jaeger
  labels: { app.kubernetes.io/name: jaeger, app.kubernetes.io/instance: {{ .Release.Name }} }
spec:
  type: ClusterIP
  selector: { app.kubernetes.io/name: jaeger, app.kubernetes.io/instance: {{ .Release.Name }} }
  ports:
    - { name: otlp-http, port: 4318, targetPort: otlp-http }
    - { name: query, port: 16686, targetPort: query }
{{- else if not (has (.Values.otel.collector | default "none") (list "none" "phoenix")) }}
{{- fail "otel.collector must be none, jaeger or phoenix" }}
{{- end }}
