{{- if eq (.Values.otel.collector | default "none") "jaeger" }}
# §24.3: Jaeger all-in-one for trying telemetry out and for the test runs — in-memory storage, no authentication.
# Not for production: point Config → Telemetry at your own OTLP collector there. Deliberately no Ingress/HTTPRoute.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jaeger
  labels: { app.kubernetes.io/name: jaeger, app.kubernetes.io/instance: {{ .Release.Name }} }
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: jaeger, app.kubernetes.io/instance: {{ .Release.Name }} }
  template:
    metadata:
      labels: { app.kubernetes.io/name: jaeger, app.kubernetes.io/instance: {{ .Release.Name }} }
    spec:
      securityContext: { runAsNonRoot: true, runAsUser: 10001 }
      containers:
        - name: jaeger
          image: {{ .Values.otel.jaeger.image | quote }}
          args: ["--memory.max-traces=20000"]
          env:
            - { name: COLLECTOR_OTLP_ENABLED, value: "true" }
          securityContext: { allowPrivilegeEscalation: false, capabilities: { drop: [ALL] }, seccompProfile: { type: RuntimeDefault } }
          ports:
            - { name: otlp-http, containerPort: 4318 }
            - { name: query, containerPort: 16686 }
            - { name: admin, containerPort: 14269 }
          readinessProbe: { httpGet: { path: /, port: admin }, periodSeconds: 5 }
          resources: {{- toYaml .Values.otel.jaeger.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: jaeger
  labels: { app.kubernetes.io/name: jaeger, app.kubernetes.io/instance: {{ .Release.Name }} }
spec:
  type: ClusterIP
  selector: { app.kubernetes.io/name: jaeger, app.kubernetes.io/instance: {{ .Release.Name }} }
  ports:
    - { name: otlp-http, port: 4318, targetPort: otlp-http }
    - { name: query, port: 16686, targetPort: query }
{{- else if not (has (.Values.otel.collector | default "none") (list "none" "phoenix")) }}
{{- fail "otel.collector must be none, jaeger or phoenix" }}
{{- end }}
