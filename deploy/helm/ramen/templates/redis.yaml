{{- if and .Values.redis.externalUrl (not .Values.redis.auth.existingSecret) }}
{{- /* 1.0.0c: a managed Redis — its URL (rediss://, TLS) into the Secret the console reads; nothing runs here */ -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ramen.redis.secretName" . }}
  labels: { app.kubernetes.io/name: redis, app.kubernetes.io/instance: {{ .Release.Name }} }
type: Opaque
stringData:
  password: {{ regexReplaceAll "^rediss?://(?:[^:@/]*:)?([^@]*)@.*$" .Values.redis.externalUrl "${1}" | quote }}
  url: {{ .Values.redis.externalUrl | quote }}
{{- end }}
{{- if .Values.redis.enabled }}
{{- if and (not .Values.redis.auth.generate) (not .Values.redis.auth.existingSecret) }}
{{- fail "redis.auth.generate is false and redis.auth.existingSecret is empty: Redis never runs without a password" }}
{{- end }}
{{- $secret := include "ramen.redis.secretName" . }}
{{- if not .Values.redis.auth.existingSecret }}
{{- /* §33.4a: a random password, kept across upgrades (`lookup` finds the one already written; empty under `helm template`) */ -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secret }}
{{- $password := randAlphaNum 32 }}{{/* ggignore: generated at install time, not a secret in the source */}}
{{- if and $existing $existing.data (index $existing.data "password") }}
{{- $password = index $existing.data "password" | b64dec }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secret }}
  labels: { app.kubernetes.io/name: redis, app.kubernetes.io/instance: {{ .Release.Name }} }
type: Opaque
stringData:
  password: {{ $password | quote }}
  url: {{ printf "rediss://:%s@redis.%s.svc.cluster.local:6379" $password .Release.Namespace | quote }}   # D86: TLS only
---
{{- end }}
# §33.4a: the shared Redis (scope throttle, tasks, consent) with `requirepass` from the Secret; reachable from the
# console and the worker namespaces only (networkpolicy.yaml). One replica, no persistence: counters and tasks are
# short-lived by contract.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  labels: { app.kubernetes.io/name: redis, app.kubernetes.io/instance: {{ .Release.Name }} }
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: redis, app.kubernetes.io/instance: {{ .Release.Name }} }
  template:
    metadata:
      labels: { app.kubernetes.io/name: redis, app.kubernetes.io/instance: {{ .Release.Name }} }
    spec:
      securityContext: { runAsNonRoot: true, runAsUser: 999, runAsGroup: 1000, seccompProfile: { type: RuntimeDefault } }
      automountServiceAccountToken: false
      containers:
        - name: redis
          image: {{ .Values.redis.image | quote }}
          # D86 §39.3: TLS only (no plaintext port); the password stays the client credential, no client certificates
          args: ["--requirepass", "$(REDIS_PASSWORD)", "--save", "", "--appendonly", "no",
                 "--port", "0", "--tls-port", "6379", "--tls-cert-file", "/tls/tls.crt", "--tls-key-file", "/tls/tls.key",
                 "--tls-ca-cert-file", "/tls/ca.crt", "--tls-auth-clients", "no"]
          env:
            - name: REDIS_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ $secret }}, key: password } }
          securityContext: { allowPrivilegeEscalation: false, capabilities: { drop: [ALL] }, readOnlyRootFilesystem: true }
          ports:
            - { name: redis, containerPort: 6379 }
          readinessProbe: { tcpSocket: { port: redis }, periodSeconds: 5 }
          resources: {{- toYaml .Values.redis.resources | nindent 12 }}
          volumeMounts: [{ name: data, mountPath: /data }, { name: tls, mountPath: /tls, readOnly: true }]
      volumes:
        - { name: data, emptyDir: {} }
        - { name: tls, secret: { secretName: ramen-tls-redis } }   # written by the console (D86 §39.2)
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  labels: { app.kubernetes.io/name: redis, app.kubernetes.io/instance: {{ .Release.Name }} }
spec:
  type: ClusterIP
  selector: { app.kubernetes.io/name: redis, app.kubernetes.io/instance: {{ .Release.Name }} }
  ports:
    - { name: redis, port: 6379, targetPort: redis }
{{- end }}
