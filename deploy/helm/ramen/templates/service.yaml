apiVersion: v1
kind: Service
metadata:
  name: console
  labels: {{- include "ramen.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector: {{- include "ramen.selector" . | nindent 4 }}
  # D86 §39.3: TLS to the pod; GKE's backend speaks HTTPS to it (ALB / Envoy: their own annotations and policy)
  ports:
    - name: https
      port: 443
      targetPort: https
      {{- if eq .Values.provider "gcp" }}
      appProtocol: HTTPS
      {{- end }}
