apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.serviceAccount.name }}
  labels: {{- include "ramen.labels" . | nindent 4 }}
  annotations:
    {{- if eq .Values.provider "azure" }}
    azure.workload.identity/client-id: {{ required "azure.clientId (terraform output console_client_id)" .Values.azure.clientId | quote }}
    azure.workload.identity/tenant-id: {{ .Values.azure.tenantId | quote }}
    {{- else if eq .Values.provider "aws" }}
    eks.amazonaws.com/role-arn: {{ include "ramen.roleArn" . }}
    {{- else }}
    iam.gke.io/gcp-service-account: {{ include "ramen.gsa" . }}
    {{- end }}
