{{- if and (eq .Values.provider "aws") (.Values.storage | default dict).createAwsGp3 }}
# EKS: the encrypted gp3 class the chart's PVCs bind to (storage.className=gp3); provisioned by the aws-ebs-csi-driver
# addon (deploy/terraform/aws, CloudFormation EbsCsi). The cluster default, so a PVC naming no class binds here too.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: gp3
  labels: { app.kubernetes.io/name: ramen-storage, app.kubernetes.io/instance: {{ .Release.Name }} }
  annotations:
    storageclass.kubernetes.io/is-default-class: "true"
provisioner: ebs.csi.aws.com
volumeBindingMode: WaitForFirstConsumer
allowVolumeExpansion: true
reclaimPolicy: Delete
parameters:
  type: gp3
  encrypted: "true"
{{- end }}
