{{- $root := . }}
{{- range .Values.zones }}
{{- $name := include "ramen.workerName" (dict "root" $root "zone" .) }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels: {{- include "ramen.labels" $root | nindent 4 }}
    ramen.io/role: worker
    ramen.io/zone: {{ .name }}
spec:
  replicas: {{ .replicas }}
  selector:
    matchLabels: { app.kubernetes.io/instance: {{ $root.Release.Name }}, ramen.io/role: worker, ramen.io/zone: {{ .name }} }
  template:
    metadata:
      labels: {{- include "ramen.labels" $root | nindent 8 }}
        ramen.io/role: worker
        ramen.io/zone: {{ .name }}
    spec:
      serviceAccountName: {{ include "ramen.fullname" $root }}
      securityContext: { runAsNonRoot: true, runAsUser: 10001, fsGroup: 10001 }
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions: [{ key: topology.kubernetes.io/zone, operator: In, values: [{{ .name | quote }}] }]
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: { app.kubernetes.io/instance: {{ $root.Release.Name }}, ramen.io/role: worker, ramen.io/zone: {{ .name }} }
      containers:
        - name: worker
          image: "{{ $root.Values.image.worker }}:{{ $root.Values.image.tag }}"
          imagePullPolicy: {{ $root.Values.image.pullPolicy }}
          ports: [{ name: http, containerPort: {{ $root.Values.worker.port }} }]
          env:
            - { name: RAMEN_ZONE, value: {{ .name | quote }} }
          envFrom:
            - configMapRef: { name: {{ include "ramen.fullname" $root }}-env }
            - secretRef: { name: {{ include "ramen.fullname" $root }}-secrets }
          resources: {{- toYaml (index $root.Values.worker.sizes .size) | nindent 12 }}
          livenessProbe: { httpGet: { path: /healthz, port: http }, periodSeconds: 10 }
          readinessProbe: { httpGet: { path: /readyz, port: http }, periodSeconds: 5 }
          volumeMounts: [{ name: buckets, mountPath: {{ $root.Values.worker.bucketPath }} }]
      volumes:
        - name: buckets
          {{- toYaml $root.Values.worker.bucketVolume | nindent 10 }}
{{- end }}
