{{- $root := . }}
{{- range .Values.zones }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "ramen.workerName" (dict "root" $root "zone" .) }}
  labels: {{- include "ramen.labels" $root | nindent 4 }}
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: {{ include "ramen.workerName" (dict "root" $root "zone" .) }} }
  minReplicas: {{ .minReplicas }}
  maxReplicas: {{ .maxReplicas }}
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: {{ $root.Values.worker.hpaCpuPercent }} } }
{{- end }}
