# helm upgrade --install ramen deploy/helm/ramen -n ramen-system --create-namespace -f my-values.yaml
provider: gcp                # gcp | aws (CONTRACTS §7 / §8). provider=aws verified live on a real account (v0.5.6 N10).
project: ""                  # GCP project id (required on gcp)
region: us-central1          # GCP region, or AWS region (e.g. us-east-1) when provider=aws
aws:                         # provider=aws only (terraform -chdir=deploy/terraform/aws output)
  account: ""                # AWS account id (required): ECR image + groups bucket ramen-<account>-groups defaults
  cluster: ramen             # EKS cluster name (RAMEN_EKS_CLUSTER; CloudWatch log group /aws/containerinsights/<cluster>/application)
  table: ramen               # DynamoDB state table (RAMEN_DDB_TABLE; terraform var.table, defaults match unless overridden)
  certificateArn: ""         # ACM certificate for the ALB HTTPS listener (terraform output certificate_arn; self-signed import)
  albGroup: ramen            # ALB IngressGroup shared by the console Ingress ("/") and every worker Ingress (gRPC, header rules; CONTRACTS §11)
  roleArn: ""                # console IAM role (IRSA); default arn:aws:iam::<account>:role/ramen/ramen-console
image:
  repository: ""             # default: <region>-docker.pkg.dev/<project>/ramen/console (gcp) or <account>.dkr.ecr.<region>.amazonaws.com/ramen/console (aws);
                             # any reference works on both clouds, e.g. the public docker.io/bkraad47/ramen-console (or ghcr.io/bkraad47/...) — no `make push` needed
  tag: 0.7.0
  pullPolicy: Always          # version tags are re-pushed during development

serviceAccount:
  name: console
  gsa: ""                    # default: ramen-console@<project>.iam.gserviceaccount.com (terraform output console_gsa)

console:
  replicas: 1
  port: 8000
  resources: { requests: { cpu: 250m, memory: 512Mi } }   # Autopilot sets limits = requests
  backendTimeoutSec: 300     # GCPBackendPolicy timeout (gcp only): IAM/compute calls exceed the LB's 30s default
  env:                       # CONTRACTS §7 console runtime env; RAMEN_GCP_PROJECT/REGION/GROUPS_BUCKET/IMAGE_WORKER default from project/region.
                             # Keys set here win over the defaults: RAMEN_IMAGE_WORKER: docker.io/bkraad47/ramen-worker:<tag> deploys the public worker image
    RAMEN_STORE: firestore
    RAMEN_CLOUD: gcp
    RAMEN_SECRETS_BACKEND: gcp
    RAMEN_ADMIN_EMAIL: admin@ramen.local
    # RAMEN_PUBLIC_URL: https://<console static ip>   # CONTRACTS §16.3: the OAuth issuer; without it deployed workers
    #                                                 # accept rmk_ keys only and the deploy job log says so
  secrets:                   # rendered into Secret ramen-console; set via --set or a values file kept out of git
    RAMEN_ADMIN_PASSWORD: ""
    RAMEN_FERNET_KEY: ""
    RAMEN_ADMIN_KEY: ""
  existingSecret: ""         # use this Secret instead of rendering console.secrets

gateway:                     # GKE Gateway API (gcp only; on aws the ALB Ingress in templates/ingress-aws.yaml replaces it)
  enabled: true
  name: ramen
  className: gke-l7-global-external-managed
  staticIpName: ramen-console          # terraform google_compute_global_address.console
  tlsSecret: ramen-console-tls         # created by deploy/scripts/selfsigned.sh <console_ip>; ignored when certificateMap is set
  certificateMap: ""                   # terraform output certificate_map (v0.5.5 I11): Google-managed cert, no kubectl/self-signed step needed
  routesLabel: ramen.io/routes         # namespaces labelled <routesLabel>=true may attach HTTPRoutes (worker namespaces; label ramen-system too)
rbac:
  create: true                         # ClusterRole ramen-console (namespaces, networkpolicies, routes, rolebindings) + unbound ramen-console-zone bound per zone namespace by the console (SEC-09)
