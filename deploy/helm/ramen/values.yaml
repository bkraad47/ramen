# helm upgrade --install ramen deploy/helm/ramen -n ramen-system --create-namespace -f my-values.yaml
provider: gcp                # gcp | aws | azure (CONTRACTS §7 / §8 / §21.6). provider=aws verified live on a real account (v0.5.6 N10).
project: ""                  # GCP project id (required on gcp)
region: us-central1          # GCP region, AWS region (us-east-1) when provider=aws, Azure location (eastus) when provider=azure
aws:                         # provider=aws only (terraform -chdir=deploy/terraform/aws output)
  account: ""                # AWS account id (required): ECR image + groups bucket ramen-<account>-groups defaults
  cluster: ramen             # EKS cluster name (RAMEN_EKS_CLUSTER; CloudWatch log group /aws/containerinsights/<cluster>/application)
  table: ramen               # DynamoDB state table (RAMEN_DDB_TABLE; terraform var.table, defaults match unless overridden)
  certificateArn: ""         # ACM certificate for the ALB HTTPS listener (terraform output certificate_arn; self-signed import)
  albGroup: ramen            # ALB IngressGroup shared by the console Ingress ("/") and every worker Ingress (gRPC, header rules; CONTRACTS §11)
  roleArn: ""                # console IAM role (IRSA); default arn:aws:iam::<account>:role/ramen/ramen-console
azure:                       # provider=azure only (terraform -chdir=deploy/terraform/azure output helm_set prints all of it)
  subscriptionId: ""
  zonal: true                 # false when the AKS node pool has no availability zones (RAMEN_AZURE_ZONAL=0)
  tenantId: ""
  resourceGroup: ""          # ramen-<suffix>
  nodeResourceGroup: ""      # MC_..., where the edge's static public IP lives
  publicIpName: ramen-edge   # the Envoy Gateway Service binds this IP (terraform azurerm_public_ip.edge)
  publicHostname: ""         # <ip-with-dashes>.sslip.io: the certificate's name and the console's public URL
  acr: ""                    # <registry>.azurecr.io; images <acr>/ramen/console and <acr>/ramen/worker
  storageAccount: ""         # blob container `groups` (code bucket, az://) + table `ramen` (RAMEN_STORE=azuretables)
  keyVault: ""               # RAMEN_SECRETS_BACKEND=azure
  clientId: ""               # the console's user-assigned identity (workload identity)
  oidcIssuer: ""             # AKS OIDC issuer: zone identities' federated credentials trust it
  tls: letsencrypt           # letsencrypt (cert-manager HTTP-01 through the Gateway) | selfsigned
  acmeEmail: ""
  acmeServer: https://acme-v02.api.letsencrypt.org/directory   # staging: https://acme-staging-v02.api.letsencrypt.org/directory
  gatewayClass: ramen-envoy
image:
  repository: ""             # default: <region>-docker.pkg.dev/<project>/ramen/console (gcp), <account>.dkr.ecr.<region>.amazonaws.com/ramen/console (aws) or <acr>/ramen/console (azure);
                             # any reference works on both clouds, e.g. the public docker.io/bkraad47/ramen-console (or ghcr.io/bkraad47/...) — no `make push` needed
  tag: 1.0.0
  # §38.2 (D85): pin the platform images by digest (sha256:<64 hex>). When set the console runs <repository>@<digest>
  # and workers default to <worker repository>@<workerDigest>; the tag is then informational. Read them after a push:
  # `docker buildx imagetools inspect <ref> --format '{{json .Manifest.Digest}}'` (or the cloud's registry console).
  digest: ""
  workerDigest: ""
  pullPolicy: Always          # version tags are re-pushed during development

serviceAccount:
  name: console
  gsa: ""                    # default: ramen-console@<project>.iam.gserviceaccount.com (terraform output console_gsa)

console:
  replicas: 1
  minReadySeconds: 90        # a new console pod serves this long before the old one stops (load-balancer attach time)
  port: 8000
  resources: { requests: { cpu: 250m, memory: 512Mi } }   # Autopilot sets limits = requests
  backendTimeoutSec: 300     # GCPBackendPolicy timeout (gcp only): IAM/compute calls exceed the LB's 30s default
  env:                       # CONTRACTS §7 console runtime env; RAMEN_GCP_PROJECT/REGION/GROUPS_BUCKET/IMAGE_WORKER default from project/region.
                             # Keys set here win over the defaults: RAMEN_IMAGE_WORKER: docker.io/bkraad47/ramen-worker:<tag> deploys the public worker image
    RAMEN_STORE: firestore
    RAMEN_CLOUD: gcp
    RAMEN_SECRETS_BACKEND: gcp
    RAMEN_ADMIN_EMAIL: admin@ramen.local
    # RAMEN_PUBLIC_URL: https://<console static ip>   # CONTRACTS §16.3: the OAuth issuer; without it deployed workers
    #                                                 # accept rmk_ keys only and the deploy job log says so
  # §28 satellite clusters: how the console appears to a satellite API server (GKE: User <gsa email>, EKS: Group
  # ramen-console from the access entry, AKS: User <object id>) and the home networks its traffic comes from (the home
  # pod range / VPC / VNet) — bound in every zone namespace and admitted by every worker NetworkPolicy.
  k8sSubjects: []            # e.g. [{kind: Group, name: ramen-console}]   (--set-json 'console.k8sSubjects=[...]')
  sourceCidrs: []            # e.g. [10.7.128.0/17]
  secrets:                   # rendered into Secret ramen-console; set via --set or a values file kept out of git
    RAMEN_ADMIN_PASSWORD: ""
    RAMEN_FERNET_KEY: ""
    RAMEN_ADMIN_KEY: ""
  existingSecret: ""         # use this Secret instead of rendering console.secrets

# D86 (CONTRACTS §39): TLS on every hop with Ramen's own per-install CA — no cert-manager, no mesh. The console creates
# the CA once (its key stays in the console's secret store), issues 30-day leaves to itself, to every zone at deploy and
# to the services below (Secrets ramen-tls-<svc>, ConfigMap ramen-ca), and renews them. `require: false` does not
# render: plaintext is refused on cloud installs.
tls:
  require: true
  leafDays: 30               # RAMEN_TLS_LEAF_DAYS
  renewSecs: 3600            # RAMEN_TLS_RENEW_SECS: how often due leaves are re-issued

gateway:                     # GKE Gateway API (gcp only; aws uses the ALB Ingress in templates/ingress-aws.yaml, azure the Envoy Gateway in templates/gateway-azure.yaml)
  enabled: true
  name: ramen
  className: gke-l7-global-external-managed
  staticIpName: ramen-console          # terraform google_compute_global_address.console
  tlsSecret: ramen-console-tls         # created by deploy/scripts/selfsigned.sh <console_ip>; ignored when certificateMap is set
  certificateMap: ""                   # terraform output certificate_map (v0.5.5 I11): Google-managed cert, no kubectl/self-signed step needed
  routesLabel: ramen.io/routes         # namespaces labelled <routesLabel>=true may attach HTTPRoutes (worker namespaces; label ramen-system too)
rbac:
  create: true                         # ClusterRole ramen-console (namespaces, networkpolicies, routes, rolebindings) + unbound ramen-console-zone bound per zone namespace by the console (SEC-09)

# §33.4a network. `system`: NetworkPolicies in this namespace — Phoenix / Jaeger, promptfoo, Redis and the console accept
# ingress only from the console, the evals/scan Job pods, the worker namespaces (the console's /otlp + wake callbacks,
# the collector on 4318, Redis) and the edge. `workerEgress`: the console writes `worker-egress` into every zone
# namespace — DNS, the console, Redis, the collector, the zone's own pods and the internet, never another ClusterIP;
# it needs `cluster.serviceCidr` (skipped with a NOTES warning without it).
networkPolicy:
  system: true
  workerEgress: true
  edgeCidrs: []              # where edge traffic to a ramen-system pod comes from; default: gcp → the Google front ends
                             # 35.191.0.0/16 + 130.211.0.0/22, aws → awsAlbCidrs, azure → the edgeNamespaces below
  awsAlbCidrs: []            # aws (D89): the public subnets the ALB addresses pods from, never the pod subnets; also
                             # the console's RAMEN_AWS_ALB_CIDRS (zone policies). Terraform `network_set` /
                             # CloudFormation `NetworkSet` carry them ({10.42.0.0/24,10.42.1.0/24})
  awsVpcCidr: 10.0.0.0/16    # deprecated (pre-D89, a whole VPC — admits every pod in it): used only when awsAlbCidrs
                             # is empty
  edgeNamespaces: []         # namespaces whose pods are the edge; default on azure: envoy-gateway-system
cluster:
  serviceCidr: ""            # the cluster's Service range: GKE `gcloud container clusters describe … --format='value(servicesIpv4Cidr)'`,
                             # EKS `aws eks describe-cluster --name … --query cluster.kubernetesNetworkConfig.serviceIpv4Cidr`
                             # (172.20.0.0/16 for a VPC inside 10.0.0.0/8 like the default 10.42.0.0/16), AKS `serviceCidr`
                             # (10.0.0.0/16), kind 10.96.0.0/16; no terraform output carries it

# PVCs (promptfoo, Phoenix). EKS ships only the in-tree `gp2` class, which provisions nothing: the PVCs stay Pending.
# Terraform `engines_set` / CloudFormation `StorageSet` set both values below (the EBS CSI addon is in both installers).
storage:
  className: ""              # every PVC's class unless evals.storageClassName / otel.phoenix.persistence.storageClass
                             # names one; "" = the cluster default
  createAwsGp3: false        # provider=aws: add StorageClass `gp3` (ebs.csi.aws.com, encrypted, WaitForFirstConsumer,
                             # the cluster default); needs the aws-ebs-csi-driver addon. false if a `gp3` class exists

# §33.4a Redis: the shared store the workers of every group use for the scope throttle, tasks and consent when the group
# names none of its own (Group page → Throttling). Password-protected: `auth.generate` writes a random one into Secret
# `ramen-redis` (kept across upgrades), or `auth.existingSecret` names a Secret with keys `password` and `url`
# (`rediss://:<password>@<host>:6379`: TLS, D86 refuses `redis://`). The console gets the URL as RAMEN_REDIS_URL from
# that Secret, never as a value.
# `externalUrl`: a managed Redis instead (Azure Managed Redis, ElastiCache, Memorystore): the chart writes the URL into
# Secret `ramen-redis` (`rediss://` is TLS, what managed instances require) and runs no Redis; keep `enabled: false`.
# Replacing a hand-applied Redis (Deployment/Service `redis`, labels `app: redis`): delete both first, then enable —
# docs/wiki/throttling.md "Replacing a hand-applied Redis" (§38.3, D85).
redis:
  enabled: false
  externalUrl: ""            # e.g. terraform output -raw redis_url on azure (--set-string redis.externalUrl=...)
  image: redis:7.4.2-alpine
  resources: { requests: { cpu: 50m, memory: 64Mi }, limits: { memory: 256Mi } }
  auth:
    generate: true
    existingSecret: ""

# §24.2 worker images built on deploy. The console starts Job/ramen-build-<hash> in this namespace. §38.2 (D85): the
# Job runs as ServiceAccount `ramen-build-<group>` and pushes to the group's own repository (GCP: Artifact Registry
# repository `ramen-groups-<group>`; AWS / Azure: `ramen/groups/<group>/worker`), both created by the console on the
# group's first build with an identity that may push there and nowhere else; the platform images (console, worker
# base, SkillSpector) are out of every build identity's reach. The console itself holds no push right.
builder:
  enabled: null              # null = on when a legacy identity below is given; Terraform's helm line sets true
  identities: cloud          # RAMEN_BUILD_IDENTITIES: cloud (per-group repository + cloud identity) | none (kind:
                             # a registry that takes anonymous pushes; only the per-group ServiceAccount is made)
  gsa: ""                    # legacy (pre-1.0.0c shared ramen-builder): any of these three still turns the builder on;
  roleArn: ""                # the identity itself is no longer used (§38.2)
  clientId: ""
  registry: ""               # RAMEN_BUILD_REGISTRY; default: the platform prefix the group repositories sit beside —
                             # <region>-docker.pkg.dev/<project>/ramen | <account>.dkr.ecr.<region>.amazonaws.com/ramen | <acr>/ramen
  image: ""                  # RAMEN_BUILDER_IMAGE; default: the console's pinned kaniko executor

# §24.3 OpenTelemetry. `jaeger` adds a Jaeger all-in-one (OTLP HTTP 4318 in, query API/UI 16686) to this namespace;
# `phoenix` adds Arize Phoenix (UI 6006, SQLite on a PVC) behind an OpenTelemetry Collector sidecar on 4318
# that turns Ramen's OTLP/JSON into the protobuf Phoenix takes and drops the metrics Phoenix has no endpoint for.
# Jaeger keeps its traces in memory: a restart (an upgrade, a CA switch, §39.1) empties it.
# Both: no auth, no route from any edge — for trying telemetry out and for the test runs, NOT for production.
# Point Config → Telemetry at http://jaeger.<namespace>:4318 or http://phoenix.<namespace>:4318.
otel:
  collector: none            # none | jaeger | phoenix
  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    resources: { requests: { cpu: 50m, memory: 128Mi }, limits: { memory: 512Mi } }
  phoenix:
    image: arizephoenix/phoenix:version-21.1.0-nonroot
    resources: { requests: { cpu: 250m, memory: 512Mi }, limits: { memory: 1Gi } }
    collectorImage: otel/opentelemetry-collector:0.165.0
    collectorResources: { requests: { cpu: 50m, memory: 64Mi }, limits: { memory: 256Mi } }
    # b35: the span history survives restarts (a CA switch restarts Phoenix, §39.1) and upgrades; RWO, so the
    # Deployment rolls with maxSurge 0 (old pod first). false = an emptyDir, emptied on every restart.
    persistence: { enabled: true, size: 5Gi, storageClass: "" }   # "" = the cluster default

# §29.2 evals. With `image` set the console runs a group repo's mcp/evals/promptfooconfig.yaml as a promptfoo Job
# (RAMEN_EVALS_IMAGE; `--no-write`, results in the deploy job only) after each zone's golden cases; empty = no evals
# engine. `engine: promptfoo` adds a promptfoo server (UI + API on 3000, its data on a PVC) to this namespace, no auth,
# no edge route — try-out and test runs, like Jaeger/Phoenix — and every run is shared there (RAMEN_EVALS_API_URL =
# https://promptfoo.<namespace>:3000, behind its TLS front). The group page's evals badge opens the run's cases in the
# console; `uiUrl` is where a person opens promptfoo's own UI (RAMEN_EVALS_UI_URL, named on the Config page and the
# run page): `kubectl -n ramen-system port-forward deploy/promptfoo 3443:3443` → https://localhost:3443 (the pod's TLS front, signed by the install CA — trust ramen-ca's ca.crt).
evals:
  engine: none               # none | promptfoo
  uiUrl: https://localhost:3443   # the promptfoo UI as a person reaches it (the port-forward above, or your own route)
  image: ghcr.io/promptfoo/promptfoo:0.125.1   # the Jobs' and the server's image; "" runs no evals at all
  resources: { requests: { cpu: 100m, memory: 256Mi }, limits: { memory: 1Gi } }
  storage: 1Gi               # the server's PVC (/home/promptfoo/.promptfoo)
  storageClassName: ""       # "" = the cluster default
  podSecurityContext: { runAsNonRoot: true, runAsUser: 1000, fsGroup: 1000 }   # the image's `promptfoo` user
  # §33.4a: the ServiceAccount the evals and scan Jobs run as (RAMEN_EVALS_SA) — bound to nothing in the cluster; its
  # cloud identity (terraform outputs evals_gsa / evals_role_arn / evals_client_id) holds logging only. Never the builder's.
  serviceAccount: ramen-evals
  gsa: ""                    # gcp: ramen-evals@<project>.iam.gserviceaccount.com
  roleArn: ""                # aws
  clientId: ""               # azure

# §30 SkillSpector scans. `engine: skillspector` makes the console scan every group repo's mcp/skills/* plus a skill
# synthesized from the tools and prompts each zone serves, as a Job after the evals (RAMEN_SKILLSPECTOR_IMAGE, the
# builder ServiceAccount); nothing else runs — SkillSpector has no server. The image is Ramen's build of the pinned
# upstream tag (deploy/docker/skillspector; scripts/check_versions.py keeps the tag in step).
skillspector:
  engine: none               # none | skillspector
  image: ghcr.io/bkraad47/ramen-skillspector:2.13.4
  cpu: 250m                  # the Job's requests; memoryLimit its limit
  memory: 512Mi
  memoryLimit: 1Gi
  timeoutSecs: 600           # RAMEN_SKILLSPECTOR_TIMEOUT_SECS
