# helm upgrade --install ramen deploy/helm/ramen -n ramen-system --create-namespace -f my-values.yaml
project: ""                  # GCP project id (required)
region: us-central1
image:
  repository: ""             # default: <region>-docker.pkg.dev/<project>/ramen/console
  tag: 0.2.0
  pullPolicy: Always          # version tags are re-pushed during development

serviceAccount:
  name: console
  gsa: ""                    # default: ramen-console@<project>.iam.gserviceaccount.com (terraform output console_gsa)

console:
  replicas: 1
  port: 8000
  resources: { requests: { cpu: 250m, memory: 512Mi } }   # Autopilot sets limits = requests
  env:                       # CONTRACTS §7 console runtime env; RAMEN_GCP_PROJECT/REGION/GROUPS_BUCKET/IMAGE_WORKER default from project/region
    RAMEN_STORE: firestore
    RAMEN_CLOUD: gcp
    RAMEN_SECRETS_BACKEND: gcp
    RAMEN_ADMIN_EMAIL: admin@ramen.local
  secrets:                   # rendered into Secret ramen-console; set via --set or a values file kept out of git
    RAMEN_ADMIN_PASSWORD: ""
    RAMEN_FERNET_KEY: ""
    RAMEN_ADMIN_KEY: ""
  existingSecret: ""         # use this Secret instead of rendering console.secrets

gateway:                     # GKE Gateway API: one global external HTTPS LB for console ("/") and workers ("/mcp/<group>/<zone>")
  enabled: true
  name: ramen
  className: gke-l7-global-external-managed
  staticIpName: ramen-console          # terraform google_compute_global_address.console
  tlsSecret: ramen-console-tls         # created by deploy/scripts/selfsigned.sh <console_ip>
  routesLabel: ramen.io/routes         # namespaces labelled <routesLabel>=true may attach HTTPRoutes (worker namespaces; label ramen-system too)
rbac:
  create: true                         # ClusterRole for the console KSA (manages worker namespaces, HTTPRoutes)
