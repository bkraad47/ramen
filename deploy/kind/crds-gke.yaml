# The console renders two GKE-only objects for every zone (CONTRACTS §7/§11): HealthCheckPolicy and, for the console
# itself, GCPBackendPolicy. kind has no GKE controllers, so these CRDs only make the objects *accepted* — nothing acts
# on them. They exist so the zone manifests the console applies on kind are byte-identical to the GKE ones.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: healthcheckpolicies.networking.gke.io
spec:
  group: networking.gke.io
  scope: Namespaced
  names: { kind: HealthCheckPolicy, plural: healthcheckpolicies, singular: healthcheckpolicy }
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          x-kubernetes-preserve-unknown-fields: true
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: gcpbackendpolicies.networking.gke.io
spec:
  group: networking.gke.io
  scope: Namespaced
  names: { kind: GCPBackendPolicy, plural: gcpbackendpolicies, singular: gcpbackendpolicy }
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          x-kubernetes-preserve-unknown-fields: true
