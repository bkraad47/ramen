# Stand-in for the GCS groups bucket on kind. The console's sync_repo (git clone → bucket) and the runtime's
# bucket sync (bucket → /data/bucket) are the real code paths; only the endpoint changes, via STORAGE_EMULATOR_HOST.
apiVersion: v1
kind: Service
metadata:
  name: fake-gcs
  namespace: ramen-system
spec:
  type: NodePort
  selector: { app: fake-gcs }
  ports: [{ name: http, port: 4443, targetPort: 4443, nodePort: 30083 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fake-gcs
  namespace: ramen-system
spec:
  replicas: 1
  selector:
    matchLabels: { app: fake-gcs }
  template:
    metadata:
      labels: { app: fake-gcs }
    spec:
      initContainers:
        - name: mkbucket                       # the filesystem backend takes its buckets from the directories present
          image: busybox:1.37
          command: ["sh", "-c", "mkdir -p /data/ramen-kind-groups"]
          volumeMounts: [{ name: data, mountPath: /data }]
      containers:
        - name: fake-gcs
          image: fsouza/fake-gcs-server:1.52.2
          args:
            - -scheme=http
            - -port=4443
            - -filesystem-root=/data
            - -public-host=fake-gcs.ramen-system.svc.cluster.local:4443
            - -external-url=http://fake-gcs.ramen-system.svc.cluster.local:4443
          ports: [{ containerPort: 4443 }]
          resources: { requests: { cpu: 50m, memory: 64Mi } }
          volumeMounts: [{ name: data, mountPath: /data }]
      volumes: [{ name: data, emptyDir: {} }]
