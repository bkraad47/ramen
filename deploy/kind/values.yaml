# Console chart values for kind (CONTRACTS §12.3). RAMEN_CLOUD=gcp on purpose: the console drives the *same*
# Kubernetes code paths as GKE (deploy/kind/README.md says why). The GCP APIs that have no kind equivalent are
# replaced (storage → fake GCS) or degrade to a note (compute / Cloud Armor / Cloud Logging / IAM).
provider: gcp
project: kind
region: us-central1
image:
  repository: ramen-console          # side-loaded with `kind load docker-image`
  tag: 0.7.6
  pullPolicy: IfNotPresent
serviceAccount:
  name: console
console:
  replicas: 1
  port: 8000
  resources: { requests: { cpu: 100m, memory: 384Mi } }
  env:
    RAMEN_STORE: memory              # no Firestore on kind; one replica, state resets with the pod
    RAMEN_CLOUD: gcp
    RAMEN_SECRETS_BACKEND: store
    RAMEN_ADMIN_EMAIL: admin@ramen.local
    RAMEN_GCP_PROJECT: kind
    RAMEN_GCP_REGION: us-central1
    RAMEN_GROUPS_BUCKET: ramen-kind-groups
    RAMEN_IMAGE_WORKER: ramen-worker-kind:0.7.6
    STORAGE_EMULATOR_HOST: http://fake-gcs.ramen-system.svc.cluster.local:4443
    RAMEN_DEPLOY_TIMEOUT_SECS: "420"
    # §21.7 autoscaling: the proofs cannot wait the production 120 s between changes, and the demo calculator is
    # too fast for inflight alone to rise on a laptop — a lower call-rate target lets real load trip a scale-up
    RAMEN_AUTOSCALE_COOLDOWN_SECS: "10"
    RAMEN_AUTOSCALE_TARGET_RPS: "15"
    RAMEN_LOGIN_RATE_LIMIT: "0"      # the security matrix makes many deliberate failed logins
    RAMEN_COOKIE_SECURE: "0"         # no real Gateway/TLS on kind (NodePort, plaintext) — the chart
                                      # default of "1" would stop the session cookie coming back over http
  # console.secrets (admin password, admin key, session secret, Fernet key) are generated by up.sh into
  # deploy/kind/.secrets.env and passed with --set; nothing static here (scripts/check_secrets.py).
gateway:
  enabled: false                     # no GKE Gateway on kind; workers are reached through NodePorts
rbac:
  create: true
