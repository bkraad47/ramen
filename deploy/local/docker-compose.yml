# Local Ramen stack (CONTRACTS §5): Firestore emulator + console + one worker (group `demo`).
# Shell env > .env > defaults below (CI exports RAMEN_ADMIN_EMAIL/PASSWORD, RAMEN_MCP_KEYS, RAMEN_ADMIN_KEY).
# Deploy from the console writes /buckets/demo/.ramen/env-local (minted rmk_ keys) and calls the worker's ramen.v1.Admin/Reload (gRPC, CONTRACTS §11).
# Worker build context is the ramen repo root because the image needs node-rs/, runtime-py/ and proto/ (see node-rs/Dockerfile).
name: ramen
services:
  firestore:
    image: gcr.io/google.com/cloudsdktool/google-cloud-cli:emulators
    command: gcloud beta emulators firestore start --host-port=0.0.0.0:8081 --project=${GCP_PROJECT:-ramen-local}
    ports: ["8081:8081"]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:8081/ || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30

  console:
    build:
      context: ../../console
      args: { RAMEN_VERSION: "${VERSION:-0.5.3}" }
    image: ramen-console:${VERSION:-0.5.3}
    depends_on:
      firestore: { condition: service_healthy }
    environment:
      RAMEN_STORE: firestore
      FIRESTORE_EMULATOR_HOST: firestore:8081
      GOOGLE_CLOUD_PROJECT: ${GCP_PROJECT:-ramen-local}
      RAMEN_CLOUD: local
      RAMEN_TLS: self
      RAMEN_CONSOLE_PORT: "8443"
      RAMEN_ADMIN_EMAIL: ${RAMEN_ADMIN_EMAIL:-admin@ramen.local}
      RAMEN_ADMIN_PASSWORD: ${RAMEN_ADMIN_PASSWORD:-changeme-ramen}
      RAMEN_FERNET_KEY: ${RAMEN_FERNET_KEY:-0VnINh_5EgyBnkUEf44BuR7CTKLrb97GSTjdjTbbkhY=}
      RAMEN_BUCKET_ROOT: /buckets
      RAMEN_LOG_ROOT: /buckets/_logs
      RAMEN_WORKER_URL: worker:8080               # zone `local` → this worker (gRPC h2c target host:port)
      RAMEN_ADMIN_KEY: ${RAMEN_ADMIN_KEY:-local-admin-key}   # sent as metadata x-ramen-admin-key on Admin/Reload
      RAMEN_PUBLIC_URL: ${RAMEN_PUBLIC_URL:-https://localhost:8443}   # base for links in mails, and the OAuth issuer (§16.3)
      RAMEN_LOCAL_SESSION_SECRET: ${RAMEN_SESSION_SECRET:-local-session-secret}   # the worker's RAMEN_SESSION_SECRET, so console-minted tokens verify; not written to the bucket
      RAMEN_SMTP_HOST: ${RAMEN_SMTP_HOST:-file:///mail}   # dev mail backend: .eml files in ./.mail (CONTRACTS §9); set a real SMTP host to send
      RAMEN_SMTP_FROM: ${RAMEN_SMTP_FROM:-ramen@localhost}
      RAMEN_AUTH_MAGIC_LINK: ${RAMEN_AUTH_MAGIC_LINK:-0}
      RAMEN_ADMIN_FORCE_PASSWORD: ${RAMEN_ADMIN_FORCE_PASSWORD:-0}
    ports: ["8443:8443"]
    volumes:
      - buckets:/buckets
      - ./.mail:/mail

  worker:
    build:
      context: ../..
      dockerfile: node-rs/Dockerfile
      args: { VERSION: "${VERSION:-0.5.3}" }
    image: ramen-worker:${VERSION:-0.5.3}
    environment:
      RAMEN_NODE_PORT: "8080"
      RAMEN_BUCKET: /buckets/demo
      RAMEN_GROUP: demo
      RAMEN_ENV: default
      RAMEN_ZONE: local
      RAMEN_MCP_KEYS: ${RAMEN_MCP_KEYS:-local-mcp-key}
      RAMEN_ADMIN_KEY: ${RAMEN_ADMIN_KEY:-local-admin-key}
      RAMEN_ALLOWED_CIDRS: ${RAMEN_ALLOWED_CIDRS:-0.0.0.0/0,::/0}
      RAMEN_SESSION_SECRET: ${RAMEN_SESSION_SECRET:-local-session-secret}   # §16.2 session ids and §16.3 tokens; same value as the console's
      RAMEN_OAUTH_ISSUER: ${RAMEN_PUBLIC_URL:-https://localhost:8443}       # the console is the authorization server
      RAMEN_ALLOWED_ORIGINS: ${RAMEN_ALLOWED_ORIGINS:-}                     # empty: every browser Origin refused (§16.1)
      RAMEN_SIDECAR_IDLE_SECS: "300"
      RAMEN_MAX_INFLIGHT: "32"
      RAMEN_VERBOSE: ${RAMEN_VERBOSE:-0}
      RAMEN_LOG_FILE: /buckets/_logs/demo/local/worker.log   # read back by the console Logs page
    ports: ["8080:8080"]                            # Streamable HTTP /mcp and gRPC h2c (ramen.v1.Mcp / Admin / Health) on one port
    healthcheck:                                    # liveness (ramen.v1.Admin is SERVING before the first deploy); "" = readiness
      test: ["CMD", "/opt/venv/bin/ramen-mcp-bridge", "--target", "127.0.0.1:8080", "--health", "ramen.v1.Admin", "--timeout", "3"]
      interval: 10s
      timeout: 5s
      retries: 12
    volumes:
      - buckets:/buckets

volumes:
  buckets: {}
