site_name: Ramen
site_description: Multizone, highly available MCP server for GCP and AWS Kubernetes. A git repo of Python tools becomes a fleet of MCP workers with canary deploys, secrets, roles and OAuth. Rust node, Python runtime, FastAPI console.
site_url: https://bkraad47.github.io/ramen/
repo_url: https://github.com/bkraad47/ramen
repo_name: bkraad47/ramen
copyright: BSD-3-Clause · © 2026 Raad
docs_dir: docs
site_dir: site
strict: true
exclude_docs: |
  pyproject.toml
  uv.lock
  .venv/
hooks:
  - scripts/gen_versions.py
theme:
  name: material
  logo: img/logo-mark.png
  favicon: img/favicon.png
  language: en
  # U18: dark only. One scheme, no toggle; tokens live in docs/stylesheets/ramen.css.
  palette:
    scheme: slate
    primary: custom
    accent: custom
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
extra_css: [stylesheets/ramen.css]
extra:
  version_current: 0.7.5
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/bkraad47/ramen
    - icon: fontawesome/solid/bowl-food
      link: https://github.com/bkraad47/ramen-demo-mcp-group
markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc: { permalink: false }
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed: { alternate_style: true }
  - pymdownx.highlight: { anchor_linenums: true }
  - pymdownx.inlinehilite
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
plugins:
  - search
nav:
  - Home: index.md
  - Get started: get-started.md
  - How it works: how-it-works.md
  - Wiki:
      - Overview: wiki/index.md
      - Deploy on GCP: wiki/deploy-gcp.md
      - Deploy on AWS: wiki/deploy-aws.md
      - Groups, zones and regions: wiki/groups-zones.md
      - The MCP repo, structure and local development: wiki/mcp-repo.md
      - Secrets at runtime: wiki/secrets.md
      - Users and access: wiki/users-access.md
      - Connect a client with OAuth: wiki/connect-oauth.md
      - Connect a client with a password: wiki/connect-password.md
      - API keys and the API: wiki/api-keys.md
      - Deploy from GitHub Actions: wiki/deploy-github-actions.md
      - Throttling with Redis: wiki/throttling.md
      - Entra ID and Google Workspace: wiki/sso.md
      - Guardrails (NeMo or your own policy): wiki/guardrails.md
      - Backups: wiki/backups.md
      - Configuration: wiki/configuration.md
  - Changelog: changelog.md
  - Release: release.md
  - Reference:
      - Transport, hop by hop: wiki/transport.md
      - Threat model: threat-model.md
      - Cloud-ops agent skills: wiki/skills.md
      - Interface contracts: CONTRACTS.md
      - Contributing and modifying: contributing.md
      - Version tracker: versions.md
      - Architecture (v0.7.5): architecture/index.md
      - Architecture history:
          - v0.4.0: architecture/v0.4.0.md
          - v0.3.1: architecture/v0.3.1.md
          - v0.3.0: architecture/v0.3.0.md
          - v0.2.0: architecture/v0.2.0.md
          - v0.1.0: architecture/v0.1.0.md
