[package]
name = "ramen-node"
version = "0.2.0"
edition = "2024"
description = "Ramen MCP server node: JSON-RPC 2.0 over MCP Streamable HTTP"
license = "BSD-3-Clause"

[lib]
name = "ramen_node"
path = "src/lib.rs"

[[bin]]
name = "ramen-node"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "sync", "time", "net", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ipnet = "2"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
