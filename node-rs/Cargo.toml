[package]
name = "ramen-node"
version = "0.5.1"
edition = "2024"
description = "Ramen MCP server node: JSON-RPC 2.0 over gRPC (ramen.v1.Mcp)"
license = "BSD-3-Clause"

[lib]
name = "ramen_node"
path = "src/lib.rs"

[[bin]]
name = "ramen-node"
path = "src/main.rs"

[dependencies]
tonic = { version = "0.14", features = ["tls-ring"] }
# the node's own TLS acceptor (§16.1): tonic's offers only `h2` on ALPN, and Streamable HTTP clients speak HTTP/1.1
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
rustls-pki-types = { version = "1", features = ["std"] }
tonic-prost = "0.14"
tonic-health = "0.14"
tonic-reflection = "0.14"
prost = "0.14"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "sync", "time", "net", "signal"] }
tokio-stream = { version = "0.1", features = ["net"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ipnet = "2"
subtle = "2"
# §16: Streamable HTTP on the same port (axum is what tonic 0.14 routes on), signed session ids and HS256 token
# checks (ring is already here through tonic's TLS), base64url for both. Versions match the existing lockfile.
axum = "0.8"
http = "1"
http-body-util = "0.1"
ring = "0.17"
base64 = "0.22"

[build-dependencies]
tonic-prost-build = "0.14"
protox = "0.9"
prost = "0.14"

[dev-dependencies]
rcgen = "0.14"
