# Shared lint/format settings; console/, runtime-py/ and tests/ extend this file from their pyproject.toml.
line-length = 120
target-version = "py312"  # the runtime is Python 3.12 (NeMo Guardrails, D45); every tree keeps 3.12 syntax, the console included

[lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"] # FastAPI Depends()/Form() in parameter defaults

[lint.per-file-ignores]
"**/tests/**/*.py" = ["F811"]         # pytest fixtures imported from fakes/test modules and taken as parameters
"console/tests/conftest.py" = ["E402"] # env vars must be set before the app modules import
