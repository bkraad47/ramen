# Shared lint/format settings; console/, runtime-py/ and tests/ extend this file from their pyproject.toml.
line-length = 120
target-version = "py314"

[lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"] # FastAPI Depends()/Form() in parameter defaults

[lint.per-file-ignores]
"**/tests/**/*.py" = ["F811"]         # pytest fixtures imported from fakes/test modules and taken as parameters
"console/tests/conftest.py" = ["E402"] # env vars must be set before the app modules import

# scripts/ and deploy/ run under whatever `python3` a laptop or the CI runner has (3.12 on ubuntu-latest), not the
# console's 3.14: keep their syntax at 3.12 (PEP 758 unparenthesised `except A, B:` broke the versions job, 0.8.0).
[per-file-target-version]
"scripts/*.py" = "py312"
"deploy/**/*.py" = "py312"
