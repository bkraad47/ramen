[project]
name = "ramen-runtime"
version = "0.2.0"
description = "Ramen Python worker runtime: loads mcp/ packages from a bucket and executes them over JSON-RPC"
requires-python = ">=3.14"
license = "BSD-3-Clause"
dependencies = ["jsonschema>=4.23"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5"]
gcp = ["google-cloud-storage>=2.18"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ramen_runtime"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
source = ["src"]
