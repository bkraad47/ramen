[project]
name = "ramen-runtime"
version = "0.5.6"
description = "Ramen Python worker runtime: loads mcp/ packages from a bucket and executes them over JSON-RPC"
requires-python = ">=3.14"
license = "BSD-3-Clause"
dependencies = ["jsonschema>=4.23"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "moto[s3]>=5", "ruff>=0.16", "grpcio-tools>=1.76", "mcp>=2,<3"]
gcp = ["google-cloud-storage>=2.18"]
aws = ["boto3>=1.35"]
# ramen-mcp-bridge + `--health` probe (CONTRACTS §11); stubs in src/ramen_proto need protobuf >= the generator's.
grpc = ["grpcio>=1.76", "grpcio-health-checking>=1.76", "protobuf>=7.35"]

[project.scripts]
ramen-mcp-bridge = "ramen_runtime.bridge:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ramen_runtime", "src/ramen_proto"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
source = ["src"]
omit = ["src/ramen_proto/*"]   # generated stubs (gen_proto.sh)

[tool.ruff]
extend = "../ruff.toml"
extend-exclude = ["src/ramen_proto"]
