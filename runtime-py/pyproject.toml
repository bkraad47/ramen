[project]
name = "ramen-runtime"
version = "0.6.21"
description = "Ramen Python worker runtime: loads mcp/ packages from a bucket and executes them over JSON-RPC"
requires-python = ">=3.14"
license = "BSD-3-Clause"
dependencies = ["jsonschema>=4.23"]

[project.optional-dependencies]
# `mcp` is for deploy/local/mcp_call.py (demo.sh's smoke client), not the bridge — that lives in its own package now.
dev = ["pytest>=8", "pytest-cov>=5", "moto[s3]>=5", "ruff>=0.16", "mcp>=2,<3"]
gcp = ["google-cloud-storage>=2.18"]
aws = ["boto3>=1.35"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ramen_runtime"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
source = ["src"]

[tool.ruff]
extend = "../ruff.toml"
