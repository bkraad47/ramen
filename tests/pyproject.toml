[project]
name = "ramen-tests"
version = "0.3.0"
description = "Ramen cross-component conformance + e2e tests (run locally or against a cloud URL)"
requires-python = ">=3.14"
dependencies = [
  "pytest>=8",
  "pytest-asyncio>=1.0",
  "pytest-cov>=5",
  "httpx>=0.28",
  "mcp>=2,<3",
  "jsonschema>=4.23",
  "pyyaml>=6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ramen_tests"]

[tool.pytest.ini_options]
testpaths = ["conformance", "e2e", "cloud"]
pythonpath = ["src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
  "conformance: contract conformance suites (need RAMEN_*_URL)",
  "e2e: full console -> deploy -> MCP flow",
  "cloud: canary/rebalance/ip-rules/logs/SA/secrets (console URL; GCP asserts need RAMEN_GCP_PROJECT)",
]

[tool.coverage.run]
source = ["src"]
