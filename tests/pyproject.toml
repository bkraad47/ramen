[project]
name = "ramen-tests"
version = "0.7.2"
description = "Ramen cross-component conformance + e2e tests (run locally or against a cloud URL)"
requires-python = ">=3.14"
license = "BSD-3-Clause"
dependencies = [
  "pytest>=8",
  "pytest-asyncio>=1.0",
  "pytest-cov>=5",
  "httpx>=0.28",
  "mcp>=2,<3",
  "grpcio>=1.75",
  "grpcio-health-checking>=1.75",
  "grpcio-reflection>=1.75",
  "protobuf>=6",
  "jsonschema>=4.23",
  "pyyaml>=6",
]

[dependency-groups]
dev = ["ruff>=0.16", "grpcio-tools>=1.75"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ramen_tests", "src/ramen_proto"]

[tool.pytest.ini_options]
testpaths = ["conformance", "e2e", "cloud", "kind"]
pythonpath = ["src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
  "conformance: contract conformance suites (need RAMEN_*_URL)",
  "e2e: full console -> deploy -> MCP flow",
  "cloud: canary/rebalance/ip-rules/logs/SA/secrets (console URL; GCP asserts need RAMEN_GCP_PROJECT)",
  "kind: local multi-zone proofs on a kind cluster (need RAMEN_KIND_ZONES; deploy/kind)",
]

[tool.coverage.run]
source = ["src/ramen_tests"]

[tool.ruff]
extend = "../ruff.toml"
extend-exclude = ["src/ramen_proto"]
